<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景: 創設者の黄金と情熱のグラデーション -->
  <rect width="1024" height="1024" rx="240" fill="url(#paint0_linear)"/>
  
  <!-- 神聖なオーラを象徴する光の円 -->
  <circle cx="512" cy="512" r="400" fill="url(#paint1_radial)" fill-opacity="0.3"/>
  
  <!-- HOHO スマイルシンボル (微笑みの連鎖) -->
  <path d="M512 750C620 750 720 680 760 580" stroke="white" stroke-width="60" stroke-linecap="round"/>
  <circle cx="362" cy="400" r="50" fill="white"/>
  <circle cx="662" cy="400" r="50" fill="white"/>
  
  <!-- 万物に宿る神（光の粒子）を表現 -->
  <circle cx="200" cy="200" r="20" fill="white" opacity="0.6"/>
  <circle cx="824" cy="150" r="30" fill="white" opacity="0.4"/>
  <circle cx="150" cy="800" r="25" fill="white" opacity="0.5"/>
  <circle cx="850" cy="850" r="40" fill="white" opacity="0.3"/>

  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/> <!-- 黄金色 (Amber-500) -->
      <stop offset="1" stop-color="#E11D48"/> <!-- 慈愛の紅 (Rose-600) -->
    </linearGradient>
    <radialGradient id="paint1_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) rotate(90) scale(400)">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
